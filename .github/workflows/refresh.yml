name: Refresh FFBB data
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ffbb-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh
      - run: npm test
      - name: Commit validated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poule-b.json data/teams-map.json data/odds.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh official FFBB Group B results and odds"
          git push
